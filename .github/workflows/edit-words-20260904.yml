name: Edit words 20260904

on:
  push:
    paths:
      - 'scripts/edit_words_20260904.py'
      - '.github/workflows/edit-words-20260904.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply edits
        run: python scripts/edit_words_20260904.py
      - name: Commit words.txt if changed
        run: |
          if git diff --quiet -- words.txt; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add words.txt
          git commit -m 'Update vocabulary selections'
          git push
