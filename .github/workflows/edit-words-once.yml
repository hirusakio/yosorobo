name: Edit words once

on:
  push:
    paths:
      - 'scripts/edit_words_once.py'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply edits if script exists
        run: |
          if [ ! -f scripts/edit_words_once.py ]; then
            exit 0
          fi
          python scripts/edit_words_once.py
      - name: Commit words.txt if changed
        run: |
          if git diff --quiet -- words.txt; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add words.txt
          git commit -m 'Update selected vocabulary entries'
          git push
