name: Consolidate vocabulary

on:
  push:
    paths:
      - 'scripts/consolidate_words.py'
      - '.github/workflows/consolidate-words.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Consolidate vocabulary files
        run: python scripts/consolidate_words.py
      - name: Commit consolidated vocabulary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Consolidate vocabulary into words.txt"
            git push
          fi
