name: Add selected words

on:
  push:
    paths:
      - 'scripts/add_selected_words.py'
      - '.github/workflows/add-selected-words.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply additions if script exists
        run: |
          if [ ! -f scripts/add_selected_words.py ]; then
            exit 0
          fi
          python scripts/add_selected_words.py
      - name: Commit words.txt if changed
        run: |
          if git diff --quiet -- words.txt; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add words.txt
          git commit -m 'Add selected vocabulary'
          git push