name: Dedupe vocabulary files

on:
  push:
    paths:
      - '.github/workflows/dedupe-words.yml'

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove duplicate vocabulary entries
        shell: python
        run: |
          from pathlib import Path

          files = [
              'words1.txt',
              'words2.txt',
              'words3.txt',
              'words4.txt',
              'words5.txt',
              'words6.txt',
              'words7.txt',
              'words8.txt',
              'noun_candidates_1000plus.txt',
              'verb_candidates.txt',
              'adjective_candidates_2000.txt',
          ]

          seen = set()
          removed_total = 0
          report = []

          for name in files:
              path = Path(name)
              if not path.exists():
                  report.append(f'{name}: missing')
                  continue

              raw = path.read_text(encoding='utf-8').splitlines()
              kept = []
              removed = 0

              for line in raw:
                  word = line.strip()
                  if not word:
                      continue
                  if word in seen:
                      removed += 1
                      continue
                  seen.add(word)
                  kept.append(word)

              path.write_text('\n'.join(kept) + ('\n' if kept else ''), encoding='utf-8')
              removed_total += removed
              report.append(f'{name}: {len(raw)} -> {len(kept)} ({removed} removed)')

          print('\n'.join(report))
          print(f'Total duplicates removed: {removed_total}')

      - name: Commit deduplicated files
        run: |
          if git diff --quiet -- '*.txt'; then
            echo 'No duplicates found.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add words1.txt words2.txt words3.txt words4.txt words5.txt words6.txt words7.txt words8.txt noun_candidates_1000plus.txt verb_candidates.txt adjective_candidates_2000.txt
          git commit -m 'Remove duplicate vocabulary entries'
          git push
