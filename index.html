<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>要素ロボ</title>
<style>
:root{--bg:#f6f6f4;--text:#171717;--muted:#777;--panel:rgba(246,246,244,.88);--border:#ddd;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#111;--text:#f3f3f3;--muted:#aaa;--panel:rgba(17,17,17,.88);--border:#333}}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
#river{position:fixed;inset:0;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(12px,env(safe-area-inset-top)) 14px 10px;background:linear-gradient(to bottom,var(--panel) 65%,transparent);pointer-events:none}
h1{font-size:20px;margin:0;font-weight:700}.info{font-size:11px;color:var(--muted);white-space:nowrap}
.word{position:absolute;top:-70px;left:0;display:block;white-space:nowrap;font-weight:600;line-height:1.2;will-change:transform,opacity;animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards;user-select:none;pointer-events:none;text-shadow:0 1px 0 color-mix(in srgb,var(--bg) 65%,transparent)}
@keyframes fall{0%{transform:translate3d(0,-80px,0);opacity:0}5%{opacity:1}92%{opacity:1}100%{transform:translate3d(0,calc(100vh + 140px),0);opacity:0}}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div id="river"></div>
<header><h1>要素ロボ</h1><div class="info" id="info">読み込み中…</div></header>
<div id="loading" class="loading">語彙を読み込んでいます…</div>
<script>
const FILES=['words1.txt','words2.txt','words3.txt','words4.txt','words5.txt'];
const river=document.getElementById('river'),info=document.getElementById('info'),loading=document.getElementById('loading');
let words=[],lastWord='',timer=null;
function pick(){if(!words.length)return '';let w=words[Math.floor(Math.random()*words.length)];if(words.length>1){while(w===lastWord)w=words[Math.floor(Math.random()*words.length)]}lastWord=w;return w}
function spawn(){
  const word=pick(); if(!word)return;
  const el=document.createElement('span'); el.className='word'; el.textContent=word;
  const vw=window.innerWidth;
  const font=Math.max(17,Math.min(30,18+Math.random()*9));
  el.style.fontSize=font+'px';
  el.style.opacity=(.78+Math.random()*.22).toFixed(2);
  river.appendChild(el);
  const width=el.getBoundingClientRect().width;
  const maxX=Math.max(8,vw-width-8);
  el.style.left=(8+Math.random()*Math.max(0,maxX-8))+'px';
  const duration=6.5+Math.random()*5;
  el.style.animationDuration=duration+'s';
  el.addEventListener('animationend',()=>el.remove(),{once:true});
}
function start(){
  if(timer)clearInterval(timer);
  for(let i=0;i<12;i++)setTimeout(spawn,i*170);
  timer=setInterval(()=>{spawn(); if(Math.random()<.30)setTimeout(spawn,120+Math.random()*180)},330);
}
Promise.all(FILES.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.text()}))).then(ts=>{
  words=[...new Set(ts.join('\n').split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];
  loading.remove(); info.textContent=`全${words.length}語から自動表示`;
  start();
}).catch(()=>{loading.textContent='語彙の読み込みに失敗しました';info.textContent='エラー'});
</script>
</body>
</html>
