<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>要素ロボ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Hachi+Maru+Pop&family=Kaisei+Decol:wght@500&family=Kiwi+Maru:wght@500&family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@700&family=Mochiy+Pop+One&family=Rampart+One&family=Reggae+One&family=RocknRoll+One&family=Shippori+Mincho:wght@600&family=Stick&family=Yomogi&family=Yuji+Mai&family=Yuji+Syuku&family=Zen+Antique&family=Zen+Kurenaido&family=Zen+Old+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f4;--text:#171717;--muted:#777;--panel:rgba(246,246,244,.88)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}#river{position:fixed;inset:0;overflow:hidden}#track{position:absolute;left:-90px;top:0;width:calc(100vw + 180px);will-change:transform;animation:flow var(--duration,60s) linear infinite}.sheet{width:100%;overflow:hidden}.row{height:31px;display:flex;align-items:center;gap:9px;width:max-content;white-space:nowrap}.word{display:inline-block;flex:none;white-space:nowrap;line-height:1;opacity:.9;user-select:none;pointer-events:none}@keyframes flow{from{transform:translate3d(0,var(--start-y),0)}to{transform:translate3d(0,0,0)}}header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(12px,env(safe-area-inset-top)) 14px 10px;background:linear-gradient(to bottom,var(--panel) 65%,transparent);pointer-events:none}h1{font-size:20px;margin:0;font-weight:700}.info{font-size:11px;color:var(--muted);white-space:nowrap}.loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted)}@media (min-width:601px){.row{height:46px;gap:13px}}
</style></head><body><div id="river"><div id="track"></div></div><header><h1>要素ロボ</h1><div class="info" id="info">読み込み中…</div></header><div id="loading" class="loading">語彙を読み込んでいます…</div>
<script>
const FILES=['words1.txt','words2.txt','words3.txt','words4.txt','words5.txt','words6.txt','words7.txt','noun_candidates_1000plus.txt','verb_candidates.txt','adjective_candidates_2000.txt'],track=document.getElementById('track'),info=document.getElementById('info'),loading=document.getElementById('loading');
const EXCLUDE=new Set(['真鍮','合板','石材','鋼','断熱材','建材','路肩','陸橋','貯水槽','排気口','換気口','字体','字間','キャプション','製本','トナー','受付票','壮行会','セットプレー']);
const COLORS=['#d65b55','#d96d47','#cf7c3d','#d18a32','#d6b82f','#c9ad18','#e0b62a','#d4a918','#bfa51f','#9aa23b','#74a64c','#4d9864','#3f9b78','#3c978b','#438ca5','#3e82b4','#4b78be','#5c78bf','#6b6fc1','#7969bd','#8a67b7','#9b62ae','#aa609f','#b95f8d','#c35f7a','#c76569','#b86f5c','#a67c51','#5e9361','#499071','#438b81','#46868f','#507f9d','#5e78a7','#6d72ad','#7c6caf','#8c68aa','#9c65a2','#aa6597','#b36b89','#9f875c','#8e8f57','#7b9659','#689b62','#579b70','#4c987f','#4b928e','#528b9b','#926ea4'];
const FONTS=[
{family:'-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif',weight:'600',chance:30},
{family:'"Hiragino Mincho ProN","Yu Mincho",serif',weight:'600',chance:20},
{family:'ui-monospace,"SFMono-Regular","Cascadia Mono","Yu Gothic",monospace',weight:'600',chance:2},
{family:'"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Yu Gothic",sans-serif',weight:'600',chance:2},
{family:'"YuKyokasho","Yu Kyokasho","Hiragino Mincho ProN",serif',weight:'500',chance:2},
{family:'"Hiragino Kaku Gothic StdN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif',weight:'800',chance:2},
{family:'"Klee","Klee One","Yu Mincho",serif',weight:'500',chance:2},
{family:'Georgia,"Times New Roman","Yu Mincho",serif',weight:'600',chance:2},
{family:'"DotGothic16",sans-serif',weight:'400',chance:2},
{family:'"Dela Gothic One",sans-serif',weight:'400',chance:2},
{family:'"Hachi Maru Pop",cursive',weight:'400',chance:2},
{family:'"Zen Kurenaido",sans-serif',weight:'400',chance:2},
{family:'"Kaisei Decol",serif',weight:'500',chance:2},
{family:'"RocknRoll One",sans-serif',weight:'400',chance:2},
{family:'"Reggae One",sans-serif',weight:'400',chance:2},
{family:'"M PLUS Rounded 1c",sans-serif',weight:'700',chance:2},
{family:'"Kosugi Maru",sans-serif',weight:'400',chance:2},
{family:'"Shippori Mincho",serif',weight:'600',chance:2},
{family:'"Zen Antique",serif',weight:'400',chance:2},
{family:'"Zen Old Mincho",serif',weight:'600',chance:2},
{family:'"Yomogi",cursive',weight:'400',chance:2},
{family:'"Yuji Syuku",serif',weight:'400',chance:2},
{family:'"Yuji Mai",serif',weight:'400',chance:2},
{family:'"Mochiy Pop One",sans-serif',weight:'400',chance:2},
{family:'"Kiwi Maru",serif',weight:'500',chance:2},
{family:'"Rampart One",sans-serif',weight:'400',chance:2},
{family:'"Stick",sans-serif',weight:'400',chance:2}
];
const SPEED=36;let words=[],resizeTimer=null,pool=[],p=0;
const isPhone=()=>Math.min(screen.width,screen.height)<=600;const rowHeight=()=>isPhone()?31:46;const layoutWidth=()=>isPhone()?Math.min(innerWidth,innerHeight):innerWidth;
function shuffle(a){const b=a.slice();for(let i=b.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function nextWord(){if(p>=pool.length){pool=shuffle(words);p=0}return pool[p++]}
function decorateWord(s){if(Math.random()<.25)s.style.color=COLORS[Math.floor(Math.random()*COLORS.length)];else s.style.color=''}
function fontSizeFor(text){const len=Array.from(text).length,scale=isPhone()?1:1.5;return Math.max(16*scale,Math.min(32*scale,(24.2+(Math.random()-.5)*16-(len-3)*.38)*scale))}
function chooseFont(){let r=Math.random()*100,sum=0;for(const f of FONTS){sum+=f.chance;if(r<sum)return f}return FONTS[0]}
function makeWord(text){const s=document.createElement('span'),f=chooseFont();s.className='word';s.textContent=text;s.style.fontSize=fontSizeFor(text)+'px';s.style.fontFamily=f.family;s.style.fontWeight=f.weight;decorateWord(s);return s}
function wordsPerRow(){const w=layoutWidth(),avg=isPhone()?46:72;return Math.ceil((w+420)/avg)+8}
function fillRow(row){const offset=Math.floor(Math.random()*100),frag=document.createDocumentFragment(),count=wordsPerRow();row.style.transform=`translateX(${-offset}px)`;for(let i=0;i<count;i++)frag.appendChild(makeWord(nextWord()));row.appendChild(frag)}
function makeSheet(){const sh=document.createElement('div');sh.className='sheet',rh=rowHeight(),rows=Math.ceil(innerHeight/rh)*4+8;for(let i=0;i<rows;i++){const row=document.createElement('div');row.className='row';fillRow(row);sh.appendChild(row)}return sh}
function build(){track.style.animation='none';track.replaceChildren();pool=shuffle(words);p=0;const a=makeSheet();track.appendChild(a);track.appendChild(a.cloneNode(true));const h=a.offsetHeight;track.style.setProperty('--start-y',`${-h}px`);track.style.setProperty('--duration',`${h/SPEED}s`);void track.offsetWidth;track.style.animation='flow var(--duration) linear infinite'}
addEventListener('resize',()=>{if(isPhone())return;clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(words.length)build()},350)});
Promise.all(FILES.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error();return r.text()}))).then(ts=>{words=[...new Set(ts.join('\n').split(/\r?\n/).map(x=>x.trim()).filter(Boolean))].filter(w=>!EXCLUDE.has(w));loading.remove();info.textContent=`全${words.length}語から自動表示`;build()}).catch(()=>{loading.textContent='語彙の読み込みに失敗しました';info.textContent='エラー'});
</script></body></html>
