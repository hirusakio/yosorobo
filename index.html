<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>要素ロボ</title>
<style>
:root{--bg:#f6f6f4;--text:#171717;--muted:#777;--panel:rgba(246,246,244,.88)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}#river{position:fixed;inset:0;overflow:hidden}#track{position:absolute;left:-90px;top:0;width:calc(100vw + 180px);will-change:transform}.sheet{width:100%;overflow:hidden}.row{height:31px;display:flex;align-items:center;gap:9px;width:max-content;white-space:nowrap}.word{display:inline-block;flex:none;white-space:nowrap;font-weight:600;line-height:1;opacity:.9;user-select:none;pointer-events:none}header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(12px,env(safe-area-inset-top)) 14px 10px;background:linear-gradient(to bottom,var(--panel) 65%,transparent);pointer-events:none}h1{font-size:20px;margin:0;font-weight:700}.info{font-size:11px;color:var(--muted);white-space:nowrap}.loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted)}
</style></head><body><div id="river"><div id="track"></div></div><header><h1>要素ロボ</h1><div class="info" id="info">読み込み中…</div></header><div id="loading" class="loading">語彙を読み込んでいます…</div>
<script>
const FILES=['words1.txt','words2.txt','words3.txt','words4.txt','words5.txt','words6.txt','words7.txt','noun_candidates_1000plus.txt','verb_candidates.txt','adjective_candidates_2000.txt'],track=document.getElementById('track'),info=document.getElementById('info'),loading=document.getElementById('loading');
const EXCLUDE=new Set(['真鍮','合板','石材','鋼','断熱材','建材','路肩','陸橋','貯水槽','排気口','換気口','字体','字間','キャプション','製本','トナー','受付票','壮行会','セットプレー']);
const COLORS=['#d65b55','#d96d47','#cf7c3d','#d18a32','#d6b82f','#c9ad18','#e0b62a','#d4a918','#bfa51f','#9aa23b','#74a64c','#4d9864','#3f9b78','#3c978b','#438ca5','#3e82b4','#4b78be','#5c78bf','#6b6fc1','#7969bd','#8a67b7','#9b62ae','#aa609f','#b95f8d','#c35f7a','#c76569','#b86f5c','#a67c51','#5e9361','#499071','#438b81','#46868f','#507f9d','#5e78a7','#6d72ad','#7c6caf','#8c68aa','#9c65a2','#aa6597','#b36b89','#9f875c','#8e8f57','#7b9659','#689b62','#579b70','#4c987f','#4b928e','#528b9b','#926ea4'];
const ALT_FONTS=[{family:'"Hiragino Mincho ProN","Yu Mincho",serif',weight:'500'},{family:'"Yu Mincho","Hiragino Mincho ProN",serif',weight:'400'},{family:'"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro",sans-serif',weight:'600'},{family:'"Hiragino Kaku Gothic StdN","Hiragino Kaku Gothic ProN",sans-serif',weight:'800'},{family:'"YuKyokasho","Yu Kyokasho",serif',weight:'500'},{family:'"Klee","Klee One","Hiragino Mincho ProN",serif',weight:'500'},{family:'"Tsukushi A Round Gothic","Hiragino Maru Gothic ProN",sans-serif',weight:'600'},{family:'"Tsukushi B Round Gothic","Hiragino Maru Gothic ProN",sans-serif',weight:'600'},{family:'"Hiragino Mincho ProN",serif',weight:'700'},{family:'Georgia,"Times New Roman","Hiragino Mincho ProN",serif',weight:'500'}];
let words=[],sheetHeight=0,y=0,last=0,resizeTimer=null,pool=[],p=0;
const isPhone=()=>Math.min(screen.width,screen.height)<=600;
const layoutWidth=()=>isPhone()?Math.min(innerWidth,innerHeight):innerWidth;
function shuffle(a){const b=a.slice();for(let i=b.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function decorateWord(s){s.style.color='';if(Math.random()<.25)s.style.color=COLORS[Math.floor(Math.random()*COLORS.length)]}
function fontSizeFor(text){const len=Array.from(text).length;return Math.max(15,Math.min(31,23.2+(Math.random()-.5)*16-(len-3)*.38))}
function chooseFontIndex(prevAlt){if(Math.random()>=.50)return -1;let i=Math.floor(Math.random()*ALT_FONTS.length);if(i===prevAlt){do{i=Math.floor(Math.random()*ALT_FONTS.length)}while(i===prevAlt)}return i}
function makeWord(text,fontIndex){const s=document.createElement('span');s.className='word';s.textContent=text;s.style.fontSize=fontSizeFor(text)+'px';if(fontIndex>=0){s.style.fontFamily=ALT_FONTS[fontIndex].family;s.style.fontWeight=ALT_FONTS[fontIndex].weight}decorateWord(s);return s}
function addWords(row,count=1){let prev=Number(row.dataset.prev||-1);for(let i=0;i<count;i++){const fi=chooseFontIndex(prev);row.appendChild(makeWord(pool[p++%pool.length],fi));prev=fi}row.dataset.prev=prev}
function fillRow(row,targetWidth){const offset=Math.floor(Math.random()*100);row.style.transform=`translateX(${-offset}px)`;let guard=0;while(row.scrollWidth<targetWidth+offset+180&&guard<80){addWords(row,1);guard++}}
function makeSheet(){const sh=document.createElement('div');sh.className='sheet';const phone=isPhone(),w=layoutWidth();const rows=phone?150:Math.max(90,Math.ceil(innerHeight/31)*5+12);for(let r=0;r<rows;r++){const row=document.createElement('div');row.className='row';sh.appendChild(row);fillRow(row,w)}return sh}
function rerollColors(){track.querySelectorAll('.word').forEach(decorateWord)}
function build(){track.replaceChildren();pool=shuffle(words);p=0;const a=makeSheet();track.appendChild(a);const b=a.cloneNode(true);track.appendChild(b);sheetHeight=a.offsetHeight;y=-sheetHeight;last=0;track.style.transform=`translate3d(0,${y}px,0)`}
function animate(t){if(!last)last=t;const dt=Math.min(40,t-last);last=t;y+=42*dt/1000;if(sheetHeight&&y>=0){y-=sheetHeight;rerollColors()}track.style.transform=`translate3d(0,${y}px,0)`;requestAnimationFrame(animate)}
addEventListener('resize',()=>{if(isPhone())return;clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(words.length)build()},350)});
Promise.all(FILES.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error();return r.text()}))).then(ts=>{words=[...new Set(ts.join('\n').split(/\r?\n/).map(x=>x.trim()).filter(Boolean))].filter(w=>!EXCLUDE.has(w));loading.remove();info.textContent=`全${words.length}語から自動表示`;build();requestAnimationFrame(animate)}).catch(()=>{loading.textContent='語彙の読み込みに失敗しました';info.textContent='エラー'});
</script></body></html>
