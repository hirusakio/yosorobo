<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>要素ロボ</title><link rel="stylesheet" href="reroll-effect.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Hachi+Maru+Pop&family=Kaisei+Decol:wght@500&family=Kiwi+Maru:wght@500&family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@700&family=Mochiy+Pop+One&family=Rampart+One&family=Reggae+One&family=RocknRoll+One&family=Shippori+Mincho:wght@600&family=Stick&family=Yomogi&family=Yuji+Mai&family=Yuji+Syuku&family=Zen+Antique&family=Zen+Kurenaido&family=Zen+Old+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f4;--text:#171717;--muted:#777;--panel:rgba(246,246,244,.88)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}#river{position:fixed;inset:0;overflow:hidden}#track{position:absolute;left:-90px;top:0;width:calc(100vw + 180px);will-change:transform;animation:flow var(--duration,60s) linear infinite}.sheet{width:100%;overflow:hidden}.row{height:36px;display:flex;align-items:center;gap:9px;width:max-content;white-space:nowrap}.word{display:inline-block;flex:none;white-space:nowrap;line-height:1;opacity:1;user-select:none;pointer-events:none}@keyframes flow{from{transform:translate3d(0,var(--start-y),0)}to{transform:translate3d(0,0,0)}}header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(12px,env(safe-area-inset-top)) 76px 10px 14px;background:linear-gradient(to bottom,var(--panel) 65%,transparent);pointer-events:none}h1{font-size:20px;margin:0;font-weight:700}.info{font-size:11px;color:var(--muted);white-space:nowrap}.loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted)}#settingsButton{position:fixed;z-index:42;right:12px;top:max(10px,env(safe-area-inset-top));height:34px;padding:0 11px;border:1px solid color-mix(in srgb,var(--text) 18%,transparent);border-radius:12px;background:color-mix(in srgb,var(--bg) 90%,transparent);color:var(--text);font:700 12px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;box-shadow:0 1px 7px rgba(0,0,0,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer}#settingsPanel{position:fixed;z-index:41;right:12px;top:max(50px,calc(env(safe-area-inset-top) + 40px));width:min(88vw,290px);padding:12px;border-radius:16px;background:color-mix(in srgb,var(--bg) 92%,transparent);color:var(--text);box-shadow:0 5px 22px rgba(0,0,0,.14);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}#settingsPanel[hidden]{display:none}.settingRow{position:relative;min-height:34px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;font-weight:700}.settingRow+.settingRow{border-top:1px solid color-mix(in srgb,var(--text) 9%,transparent)}.settingRow.updating{padding-right:24px}.settingRow.updating:after{content:"";position:absolute;right:0;width:13px;height:13px;border:2px solid color-mix(in srgb,var(--text) 18%,transparent);border-top-color:var(--text);border-radius:50%;animation:settingSpin .55s linear infinite}.settingHint{font-size:9px;font-weight:500;color:var(--muted);margin-top:-4px;padding-bottom:6px}.settingToggle{display:flex;align-items:center;cursor:pointer}.settingToggle input{position:absolute;opacity:0;pointer-events:none}.miniSwitch{position:relative;width:36px;height:21px;border-radius:999px;background:color-mix(in srgb,var(--text) 18%,transparent);transition:.15s}.miniSwitch:after{content:"";position:absolute;width:17px;height:17px;left:2px;top:2px;border-radius:50%;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}.settingToggle input:checked+.miniSwitch{background:var(--text)}.settingToggle input:checked+.miniSwitch:after{transform:translateX(15px)}.settingToggle input:disabled+.miniSwitch{opacity:.72}.speedBox{display:flex;align-items:center;gap:7px}.speedBox input{width:120px;accent-color:var(--text)}#speedValue{min-width:24px;text-align:right;font-variant-numeric:tabular-nums}@keyframes settingSpin{to{transform:rotate(360deg)}}#rerollWrap{position:fixed;right:14px;bottom:max(15px,env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column;align-items:center;gap:5px}#rerollWrap[hidden]{display:none}#reroll{width:62px;height:62px;padding:0;border:2px solid rgba(23,23,23,.30);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.97);color:#111;box-shadow:0 4px 18px </style></head><body><div id="river"><div id="track"></div></div><header><h1>要素ロボ</h1><div class="info" id="info">読み込み中…</div></header><button id="settingsButton" type="button" aria-expanded="false">設定</button><div id="settingsPanel" hidden><div class="settingRow"><span>フォント</span><label class="settingToggle"><input id="fontToggle" type="checkbox" checked><span class="miniSwitch"></span></label></div><div class="settingRow"><span>色</span><label class="settingToggle"><input id="colorToggle" type="checkbox" checked><span class="miniSwitch"></span></label></div><div class="settingRow"><span>速度</span><div class="speedBox"><input id="speedRange" type="range" min="12" max="72" step="2" value="36"><span id="speedValue">36</span></div></div><div class="settingRow"><span>文字サイズ</span><label class="settingToggle"><input id="sizeToggle" type="checkbox" checked><span class="miniSwitch"></span></label></div><div class="settingRow"><span>文字数補正</span><label class="settingToggle"><input id="lengthToggle" type="checkbox" checked><span class="miniSwitch"></span></label></div><div class="settingHint">ON：長い言葉ほど少し小さく表示</div></div><div id="rerollWrap" hidden><button id="reroll" type="button" aria-label="再抽選" title="再抽選"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 19A15.5 15.5 0 0 1 35 13" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"/><path d="M34 7L40 14L31 16Z" fill="currentColor"/><path d="M38 29A15.5 15.5 0 0 1 13 35" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"/><path d="M14 41L8 34L17 32Z" fill="currentColor"/></svg></button><div id="rerollLabel">再抽選</div></div><div id="loading" class="loading">語彙を読み込んでいます…</div>
<script>
const FILES=['words1.txt','words2.txt','words3.txt','words4.txt','words5.txt','words6.txt','words7.txt','words8.txt','words9.txt','noun_candidates_1000plus.txt','verb_candidates.txt','adjective_candidates_2000.txt'],track=document.getElementById('track'),info=document.getElementById('info'),loading=document.getElementById('loading'),reroll=document.getElementById('reroll'),rerollWrap=document.getElementById('rerollWrap'),settingsButton=document.getElementById('settingsButton'),settingsPanel=document.getElementById('settingsPanel'),fontToggle=document.getElementById('fontToggle'),colorToggle=document.getElementById('colorToggle'),speedRange=document.getElementById('speedRange'),speedValue=document.getElementById('speedValue'),sizeToggle=document.getElementById('sizeToggle'),lengthToggle=document.getElementById('lengthToggle');
const EXCLUDE=new Set(['真鍮','合板','石材','鋼','断熱材','建材','路肩','陸橋','貯水槽','排気口','換気口','字体','字間','キャプション','製本','トナー','受付票','壮行会','セットプレー']);
const COLORS=['#d65b55','#d96d47','#cf7c3d','#d18a32','#d6b82f','#c9ad18','#e0b62a','#d4a918','#bfa51f','#9aa23b','#74a64c','#4d9864','#3f9b78','#3c978b','#438ca5','#3e82b4','#4b78be','#5c78bf','#6b6fc1','#7969bd','#8a67b7','#9b62ae','#aa609f','#b95f8d','#c35f7a','#c76569','#b86f5c','#a67c51','#5e9361','#499071','#438b81','#46868f','#507f9d','#5e78a7','#6d72ad','#7c6caf','#8c68aa','#9c65a2','#aa6597','#b36b89','#9f875c','#8e8f57','#7b9659','#689b62','#579b70','#4c987f','#4b928e','#528b9b','#926ea4','#6f6f6f','#7b746f','#6f7780','#81736c','#76765f','#69746b','#77707f','#6a747b','#857b68','#736d5f','#7c7070'];
const FONTS=[{family:'-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif',weight:'600',chance:30},{family:'"Hiragino Mincho ProN","Yu Mincho",serif',weight:'600',chance:20},{family:'ui-monospace,"SFMono-Regular","Cascadia Mono","Yu Gothic",monospace',weight:'600',chance:2},{family:'"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Yu Gothic",sans-serif',weight:'600',chance:2},{family:'"YuKyokasho","Yu Kyokasho","Hiragino Mincho ProN",serif',weight:'500',chance:2},{family:'"Hiragino Kaku Gothic StdN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif',weight:'800',chance:2},{family:'"Klee","Klee One","Yu Mincho",serif',weight:'500',chance:2},{family:'Georgia,"Times New Roman","Yu Mincho",serif',weight:'600',chance:2},{family:'"DotGothic16",sans-serif',weight:'400',chance:2},{family:'"Dela Gothic One",sans-serif',weight:'400',chance:2},{family:'"Hachi Maru Pop",cursive',weight:'400',chance:2},{family:'"Zen Kurenaido",sans-serif',weight:'400',chance:2},{family:'"Kaisei Decol",serif',weight:'500',chance:2},{family:'"RocknRoll One",sans-serif',weight:'400',chance:2},{family:'"Reggae One",sans-serif',weight:'400',chance:2},{family:'"M PLUS Rounded 1c",sans-serif',weight:'700',chance:2},{family:'"Kosugi Maru",sans-serif',weight:'400',chance:2},{family:'"Shippori Mincho",serif',weight:'600',chance:2},{family:'"Zen Antique",serif',weight:'400',chance:2},{family:'"Zen Old Mincho",serif',weight:'600',chance:2},{family:'"Yomogi",cursive',weight:'400',chance:2},{family:'"Yuji Syuku",serif',weight:'400',chance:2},{family:'"Yuji Mai",serif',weight:'400',chance:2},{family:'"Mochiy Pop One",sans-serif',weight:'400',chance:2},{family:'"Kiwi Maru",serif',weight:'500',chance:2},{family:'"Rampart One",sans-serif',weight:'400',chance:2},{family:'"Stick",sans-serif',weight:'400',chance:2}];
const BASE_FONT=FONTS[0];let speed=36,words=[],resizeTimer=null,pool=[],p=0,cycleTimer=null,sheetHeight=0,fontVariation=true,colorVariation=true,sizeVariation=true,lengthCorrection=true;const isPhone=()=>Math.min(screen.width,screen.height)<=600;const rowHeight=()=>isPhone()?36:54;const layoutWidth=()=>isPhone()?Math.min(innerWidth,innerHeight):innerWidth;function shuffle(a){const b=a.slice();for(let i=b.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function nextWord(){if(p>=pool.length){pool=shuffle(words);p=0}return pool[p++]}function decorateWord(s){if(colorVariation&&Math.random()<.30)s.style.color=COLORS[Math.floor(Math.random()*COLORS.length)];else s.style.color=''}function fontSizeFor(text){const scale=isPhone()?1:1.5;if(!sizeVariation)return 24.2*scale;const len=Array.from(text).length,correction=lengthCorrection?(len-3)*.38:0;return Math.max(16*scale,Math.min(32*scale,(24.2+(Math.random()-.5)*16-correction)*scale))}function chooseFont(){if(!fontVariation)return BASE_FONT;let r=Math.random()*100,sum=0;for(const f of FONTS){sum+=f.chance;if(r<sum)return f}return FONTS[0]}function applyFont(s){const f=chooseFont();s.style.fontFamily=f.family;s.style.fontWeight=f.weight}function applySize(s){s.style.fontSize=fontSizeFor(s.textContent)+'px'}function makeWord(text){const s=document.createElement('span');s.className='word';s.textContent=text;applySize(s);applyFont(s);decorateWord(s);return s}function wordsPerRow(){const w=layoutWidth(),avg=isPhone()?46:72;return Math.ceil((w+420)/avg)+8}function fillRow(row){const offset=Math.floor(Math.random()*100),frag=document.createDocumentFragment(),count=wordsPerRow();row.style.transform=`translateX(${-offset}px)`;for(let i=0;i<count;i++)frag.appendChild(makeWord(nextWord()));row.appendChild(frag)}function makeSheet(){const sh=document.createElement('div');sh.className='sheet',rh=rowHeight(),rows=Math.ceil(innerHeight/rh)*4+8;for(let i=0;i<rows;i++){const row=document.createElement('div');row.className='row';fillRow(row);sh.appendChild(row)}return sh}function refreshFonts(){track.querySelectorAll('.word').forEach(applyFont)}function refreshColors(){track.querySelectorAll('.word').forEach(decorateWord)}function refreshSizes(){track.querySelectorAll('.word').forEach(applySize)}function applySpeed(){if(!sheetHeight)return;track.style.setProperty('--duration',`${sheetHeight/speed}s`)}function build(){clearTimeout(cycleTimer);rerollWrap.hidden=true;track.style.animation='none';track.replaceChildren();pool=shuffle(words);p=0;const a=makeSheet();track.appendChild(a);track.appendChild(a.cloneNode(true));sheetHeight=a.offsetHeight;track.style.setProperty('--start-y',`${-sheetHeight}px`);applySpeed();void track.offsetWidth;track.style.animation='flow var(--duration) linear infinite';cycleTimer=setTimeout(()=>{rerollWrap.hidden=false},sheetHeight/speed*1000)}function runSettingUpdate(input,work){const row=input.closest('.settingRow');input.disabled=true;if(row)row.classList.add('updating');requestAnimationFrame(()=>requestAnimationFrame(()=>{setTimeout(()=>{work();requestAnimationFrame(()=>{if(row)row.classList.remove('updating');input.disabled=false})},30)}))}settingsButton.addEventListener('click',()=>{const open=settingsPanel.hidden;settingsPanel.hidden=!open;settingsButton.setAttribute('aria-expanded',open)});fontToggle.addEventListener('change',()=>{fontVariation=fontToggle.checked;runSettingUpdate(fontToggle,refreshFonts)});colorToggle.addEventListener('change',()=>{colorVariation=colorToggle.checked;runSettingUpdate(colorToggle,refreshColors)});speedRange.addEventListener('input',()=>{speed=Number(speedRange.value);speedValue.textContent=speed;applySpeed()});sizeToggle.addEventListener('change',()=>{sizeVariation=sizeToggle.checked;runSettingUpdate(sizeToggle,refreshSizes)});lengthToggle.addEventListener('change',()=>{lengthCorrection=lengthToggle.checked;if(sizeVariation)runSettingUpdate(lengthToggle,refreshSizes)});reroll.addEventListener('click',build);addEventListener('resize',()=>{if(isPhone())return;clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(words.length)build()},350)});Promise.all(FILES.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error();return r.text()}))).then(ts=>{words=[...new Set(ts.join('\n').split(/\r?\n/).map(x=>x.trim()).filter(Boolean))].filter(w=>!EXCLUDE.has(w));loading.remove();info.textContent=`全${words.length}語から自動表示`;build()}).catch(()=>{loading.textContent='語彙の読み込みに失敗しました';info.textContent='エラー'});
</script><script src="reroll-effect.js"></script></body></html>
