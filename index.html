<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>要素ロボ</title><style>:root{--bg:#f6f6f4;--p:#fff;--t:#171717;--m:#737373;--b:#ddd;--a:#171717;--at:#fff;--d:#d93025;--db:#fff0ef;color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--bg:#111;--p:#1b1b1b;--t:#f3f3f3;--m:#aaa;--b:#343434;--a:#f3f3f3;--at:#111;--d:#ff6b63;--db:#2b1716}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}main{width:min(920px,100%);margin:auto;padding:16px 14px 40px}.top{position:sticky;top:0;z-index:5;padding:8px 0 12px;background:color-mix(in srgb,var(--bg) 91%,transparent);backdrop-filter:blur(12px)}h1{font-size:22px;margin:0 0 5px}.sub,.feedback,.meta,label{font-size:12px;color:var(--m)}.sub{margin:0 0 12px}label{display:block;margin:0 0 5px}.controls,.adder{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.adder{margin-top:10px}select,input,button{font:inherit;border:1px solid var(--b);border-radius:12px}select,input{width:100%;padding:11px 12px;background:var(--p);color:var(--t)}button{cursor:pointer}.primary{padding:11px 18px;background:var(--a);color:var(--at);min-width:100px}.addbtn{padding:11px 16px;background:var(--p);color:var(--t)}.feedback{min-height:20px;margin:6px 2px 0}.feedback.error{color:var(--d)}.meta{display:flex;justify-content:space-between;margin:12px 2px 10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.word{min-height:58px;padding:10px 8px;background:var(--p);color:var(--t);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}.word:active{transform:scale(.98)}dialog{border:0;padding:0;width:min(440px,calc(100% - 28px));border-radius:18px;background:var(--p);color:var(--t)}dialog::backdrop{background:#0008;backdrop-filter:blur(2px)}.modal{position:relative;min-height:230px;display:flex;align-items:center;justify-content:center;padding:58px 44px 44px}.big{font-size:clamp(36px,10vw,64px);font-weight:700;text-align:center;word-break:keep-all;overflow-wrap:anywhere}.close,.trash{position:absolute;top:14px;width:44px;height:44px;border-radius:12px;background:var(--p)}.close{left:14px;color:var(--t);font-size:22px}.trash{right:14px;color:var(--d);background:var(--db);border-color:color-mix(in srgb,var(--d) 35%,var(--b));display:grid;place-items:center}.trash svg{width:22px;fill:currentColor}@media(max-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.word{min-height:54px;font-size:15px}}@media(max-width:390px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main><section class="top"><h1>要素ロボ</h1><p class="sub">単語を追加・削除しながら、自分用の語彙プールを育てられます。</p><div class="controls"><div><label for="count">表示する語数</label><select id="count"><option>20</option><option selected>50</option><option>100</option><option>200</option></select></div><button id="shuffle" class="primary">更新</button></div><div class="adder"><div><label for="newWord">単語を追加</label><input id="newWord" maxlength="200"></div><button id="add" class="addbtn">追加</button></div><div id="feedback" class="feedback" aria-live="polite"></div></section><div class="meta"><span id="status">読み込み中…</span><span id="total"></span></div><section id="grid" class="grid"></section></main><dialog id="dlg"><div class="modal"><button id="close" class="close" aria-label="閉じる">×</button><button id="trash" class="trash" aria-label="この単語を削除"><svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-2 6h10l-1 11H8L7 9Zm3 2v7h2v-7h-2Zm4 0v7h2v-7h-2Z"/></svg></button><div id="big" class="big"></div></div></dialog><script>const FILES=['words1.txt','words2.txt','words3.txt','words4.txt','words5.txt'],AK='yosorobo_added_v2',DK='yosorobo_deleted_v2';let base=[],words=[],current=null;const $=x=>document.getElementById(x),grid=$('grid'),count=$('count'),feedback=$('feedback'),dlg=$('dlg'),big=$('big'),input=$('newWord');function read(k){try{const x=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function write(k,x){localStorage.setItem(k,JSON.stringify(x))}function rebuild(){const a=read(AK),d=new Set(read(DK));words=[...new Set([...base,...a])].filter(w=>!d.has(w));$('total').textContent=`全${words.length}語`}function sample(a,n){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b.slice(0,Math.min(n,b.length))}function placeholder(){input.placeholder=words.length?'例：'+sample(words,Math.min(3,words.length)).join('、'):'例：蛇口'}function msg(t,e=false){feedback.textContent=t;feedback.className='feedback'+(e?' error':'')}function render(){const s=sample(words,+count.value);grid.replaceChildren(...s.map(w=>{const b=document.createElement('button');b.className='word';b.textContent=w;b.onclick=()=>{current=w;big.textContent=w;dlg.showModal()};return b}));$('status').textContent=`${s.length}語を表示中`;$('total').textContent=`全${words.length}語`}function split(t){return t.split(/[、,，\n]+/).map(x=>x.trim()).filter(Boolean)}function add(){const raw=input.value.trim();if(!raw)return msg('単語を入力してください。',true);const cs=[...new Set(split(raw))],a=read(AK),d=read(DK),added=[],dups=[];for(const w of cs){if(words.includes(w))dups.push(w);else{added.push(w);a.push(w)}}write(AK,[...new Set(a)]);write(DK,d.filter(w=>!added.includes(w)));input.value='';rebuild();render();placeholder();if(added.length&&dups.length)msg(`${added.length}語追加しました。重複のため追加しなかった語：${dups.join('、')}`);else if(added.length)msg(`${added.length}語追加しました：${added.join('、')}`);else msg(`すべて登録済みです：${dups.join('、')}`,true)}function del(){if(!current)return;const w=current;write(AK,read(AK).filter(x=>x!==w));const d=read(DK);if(base.includes(w))d.push(w);write(DK,[...new Set(d)]);dlg.close();current=null;rebuild();render();placeholder();msg(`「${w}」を削除しました。`)}$('add').onclick=add;input.onkeydown=e=>{if(e.key==='Enter')add()};$('shuffle').onclick=()=>{msg('');render();placeholder()};count.onchange=render;$('trash').onclick=del;$('close').onclick=()=>dlg.close();dlg.onclick=e=>{if(e.target===dlg)dlg.close()};Promise.all(FILES.map(f=>fetch(f).then(r=>r.text()))).then(ts=>{base=[...new Set(ts.join('\n').split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];rebuild();render();placeholder()}).catch(()=>{$('status').textContent='語彙の読み込みに失敗しました';msg('ページを再読み込みしてください。',true)});</script></body></html>
