<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>要素ロボ フォント見本</title><style>body{margin:0;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f6f6f4;color:#171717}h1{font-size:24px;margin:0 0 8px}.note{color:#666;font-size:14px;line-height:1.7;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px}.name{font-size:13px;color:#666;margin-bottom:8px}.sample{font-size:34px;line-height:1.35;word-break:keep-all}.stack{font-size:11px;color:#888;margin-top:10px;line-height:1.5}.badge{display:inline-block;font-size:11px;padding:3px 7px;border-radius:999px;background:#eee;margin-left:6px}.available{margin-top:8px;font-size:11px;color:#666}</style></head><body><h1>要素ロボ フォント見本</h1><div class="note">現在は通常フォントが50%、その他10種類が各5%です。ここではサイトと同じfont-family指定で表示します。端末にそのフォントがない場合は、右側の候補へ自動的にフォールバックします。</div><div id="grid" class="grid"></div><script>
const items=[
['通常フォント','-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif','600','50%'],
['明朝A','"Hiragino Mincho ProN","Yu Mincho",serif','500','5%'],
['明朝B','"Yu Mincho","Hiragino Mincho ProN",serif','400','5%'],
['丸ゴシック','"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro",sans-serif','600','5%'],
['角ゴシック太字','"Hiragino Kaku Gothic StdN","Hiragino Kaku Gothic ProN",sans-serif','800','5%'],
['教科書体','"YuKyokasho","Yu Kyokasho",serif','500','5%'],
['Klee系','"Klee","Klee One","Hiragino Mincho ProN",serif','500','5%'],
['筑紫A丸ゴシック','"Tsukushi A Round Gothic","Hiragino Maru Gothic ProN",sans-serif','600','5%'],
['筑紫B丸ゴシック','"Tsukushi B Round Gothic","Hiragino Maru Gothic ProN",sans-serif','600','5%'],
['明朝太字','"Hiragino Mincho ProN",serif','700','5%'],
['Georgia系','Georgia,"Times New Roman","Hiragino Mincho ProN",serif','500','5%']
];
const sample='胡散臭い　ジャングル　優勝　こねくり回す';
const grid=document.getElementById('grid');
for(const [name,family,weight,pct] of items){const c=document.createElement('div');c.className='card';const first=family.split(',')[0].replaceAll('"','').trim();let ok=true;try{ok=document.fonts.check(`16px "${first}"`)}catch(e){}c.innerHTML=`<div class="name">${name}<span class="badge">${pct}</span></div><div class="sample" style="font-family:${family};font-weight:${weight}">${sample}</div><div class="stack">${family}<br>weight ${weight}</div><div class="available">先頭候補: ${ok?'利用可能':'未検出（フォールバックの可能性）'}</div>`;grid.appendChild(c)}
</script></body></html>
