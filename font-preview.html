<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>要素ロボ Webフォント候補</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Hachi+Maru+Pop&family=Kaisei+Decol:wght@500&family=M+PLUS+Rounded+1c:wght@500&family=Noto+Sans+JP:wght@600&family=Noto+Serif+JP:wght@600&family=Reggae+One&family=RocknRoll+One&family=Zen+Kurenaido&display=swap" rel="stylesheet"><style>body{margin:0;padding:24px;font-family:'Noto Sans JP',sans-serif;background:#f6f6f4;color:#171717}h1{font-size:24px;margin:0 0 8px}.note{color:#666;font-size:14px;line-height:1.7;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px}.name{font-size:14px;font-weight:600;color:#555;margin-bottom:10px}.sample{font-size:32px;line-height:1.5;word-break:keep-all}.small{font-size:18px;margin-top:10px;line-height:1.6;color:#555}.badge{display:inline-block;font-size:11px;padding:3px 7px;border-radius:999px;background:#eee;margin-left:7px}</style></head><body><h1>要素ロボ Webフォント候補</h1><div class="note">端末内蔵フォントではなく、Webフォントを実際に読み込んでいます。候補10種類を均等10%ずつ使う想定です。まだ要素ロボ本体には反映していません。</div><div id="grid" class="grid"></div><script>const items=[['Noto Sans JP','Noto Sans JP','普通のゴシック'],['Noto Serif JP','Noto Serif JP','明朝'],['M PLUS Rounded 1c','M PLUS Rounded 1c','丸ゴシック'],['Dela Gothic One','Dela Gothic One','極太・見出し'],['DotGothic16','DotGothic16','ドット・レトロ'],['Hachi Maru Pop','Hachi Maru Pop','丸い手書き'],['Zen Kurenaido','Zen Kurenaido','細い手書き'],['Kaisei Decol','Kaisei Decol','装飾的な明朝'],['RocknRoll One','RocknRoll One','ポップ・漫画'],['Reggae One','Reggae One','かなり癖の強いデザイン']];const grid=document.getElementById('grid');for(const [name,font,desc] of items){const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="name">${name}<span class="badge">10%</span>　${desc}</div><div class="sample" style="font-family:'${font}',sans-serif">胡散臭い　ジャングル<br>優勝　こねくり回す</div><div class="small" style="font-family:'${font}',sans-serif">遺書　プリン　消防車　不気味　華やか　ぶっ飛んだ</div>`;grid.appendChild(c)}</script></body></html>
